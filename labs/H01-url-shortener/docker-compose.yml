services:
  redis:
    image: redis:7-alpine
    container_name: h01-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: h01-postgres
    environment:
      POSTGRES_USER: h01
      POSTGRES_PASSWORD: h01
      POSTGRES_DB: h01
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h01"]
      interval: 2s
      timeout: 1s
      retries: 5
    command: ["postgres", "-c", "max_connections=400"]
